name: Publish site to gh-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack site
        run: |
          cat pack/site.tar.b64.part* > site.tar.b64
          echo "bd02ce9dd049630f612d23271a5b97ffd41ebd98c28e0fe2e049c92d614aeb8d  site.tar.b64" | sha256sum -c -
          mkdir _site
          base64 -d site.tar.b64 | tar -x -C _site
          touch _site/.nojekyll
          ls -la _site
      - name: Push to gh-pages
        run: |
          cd _site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
